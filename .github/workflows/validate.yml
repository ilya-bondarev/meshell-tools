name: Validate
on:
  pull_request:
  push:
    branches-ignore: [main]
permissions:
  contents: read
concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: pr
          fetch-depth: 0
          persist-credentials: false
      # Contributor files are checked by the rules already on main, not by rules the pull request could edit.
      - name: Check out base rules
        if: github.event_name == 'pull_request'
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base
          persist-credentials: false
      - name: Scan history
        working-directory: pr
        run: |
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/gitleaks.tar.gz" https://github.com/gitleaks/gitleaks/releases/download/v8.24.2/gitleaks_8.24.2_linux_x64.tar.gz
          echo "fa0500f6b7e41d28791ebc680f5dd9899cd42b58629218a5f041efa899151a8e  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git --redact --log-opts=--all .
      - name: Install validator
        env:
          RULES: ${{ github.event_name == 'pull_request' && 'base' || 'pr' }}
        run: python3 -m pip install -r "$RULES/requirements.txt"
      - name: Tests
        run: |
          python3 pr/scripts/test_catalog.py
          python3 pr/scripts/test_marketplace.py
      - name: Validate contribution
        if: github.event_name == 'pull_request'
        env:
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          MAINTAINER: ${{ github.repository_owner }}
        run: python3 base/scripts/catalog.py --root pr --base "$BASE_SHA" --pr-author "$PR_AUTHOR" --maintainer "$MAINTAINER" --output "$RUNNER_TEMP/site/index.json"
      - name: Validate branch
        if: github.event_name == 'push'
        run: python3 pr/scripts/catalog.py --root pr --output "$RUNNER_TEMP/site/index.json"
